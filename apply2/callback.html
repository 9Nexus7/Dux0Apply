<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anmeldung… – DUX0 Bewerbung</title>
  <link rel="icon" href="assets/favicon.png">
  <style>
    @font-face { font-family: "Fredoka"; font-weight: 500; src: url("assets/fredoka-500.woff2") format("woff2"); }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #f7f2ff; font: 500 1.05rem/1.6 "Fredoka", system-ui, sans-serif; text-align: center; padding: 1.5rem;
      background: radial-gradient(120% 90% at 50% 0%, #6a1fd6 0%, #2b0a6b 45%, #12042b 100%); }
    a { color: #ffd23f; font-weight: 600; } .box { max-width: 34rem; background: rgba(30,12,66,.72); border: 2px solid rgba(255,255,255,.1); border-radius: 26px; padding: 2rem 1.6rem; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
    h1 { font-size: 1.4rem; margin: 0 0 .6rem; } code { background: #12042b; padding: .1rem .4rem; border-radius: 6px; }
    .spin { width: 56px; height: 56px; margin: 0 auto 1rem; background: url("assets/mascot.webp") center/cover; border-radius: 50%; animation: b 1s ease-in-out infinite alternate; box-shadow: 0 0 0 4px #2a0b52, 0 0 30px #b47bff; }
    @keyframes b { from { transform: translateY(0) } to { transform: translateY(-10px) } }
  </style>
</head>
<body>
  <div class="box" id="box"><div class="spin"></div><p>Du wirst angemeldet…</p></div>
  <script>
    (async () => {
      const box = document.getElementById("box");
      const MESSAGES = {
        login_not_configured: "Der Bot hat noch kein Discord-Client-Secret. Der Server-Betreiber muss DUX0_CLIENT_SECRET in settings.env setzen und den Bot neu starten.",
        oauth_invalid_client: "Discord hat das Client-Secret abgelehnt. Der Betreiber muss das aktuelle Client Secret aus dem Developer Portal (OAuth2) in DUX0_CLIENT_SECRET eintragen.",
        oauth_invalid_grant: "Der Login-Code wurde abgelehnt. Das passiert, wenn die Redirect-URL im Developer Portal nicht genau passt oder die Seite neu geladen wurde. Bitte versuch die Anmeldung erneut.",
        oauth_redirect_uri: "Die Redirect-URL stimmt nicht mit der im Developer Portal überein.",
        oauth_invalid_request: "Discord hat die Anfrage abgelehnt. Bitte versuch die Anmeldung erneut.",
        bad_request: "Die Login-Antwort war unvollständig. Bitte versuch es erneut.",
      };
      const fail = (title, text, code) => {
        box.innerHTML = "";
        const h = document.createElement("h1"); h.textContent = title;
        const p = document.createElement("p"); p.textContent = text;
        const a = document.createElement("a"); a.href = "./"; a.textContent = "Zurück zur Bewerbungsseite";
        box.append(h, p);
        if (code) { const c = document.createElement("p"); c.append("Fehlercode: "); const k = document.createElement("code"); k.textContent = code; c.append(k); box.append(c); }
        box.append(a);
      };
      try {
        const q = new URLSearchParams(location.search);
        if (q.get("error")) return fail("Anmeldung abgebrochen", "Du hast den Discord-Login geschlossen oder abgelehnt.", q.get("error"));
        const code = q.get("code");
        if (!code) return fail("Anmeldung konnte nicht starten", "Discord hat keinen Login-Code geschickt.");
        if (q.get("state") !== sessionStorage.getItem("dux0a2_state")) return fail("Anmeldung konnte nicht geprüft werden", "Die Sicherheitsprüfung ist fehlgeschlagen. Bitte öffne die Seite neu und klicke erneut auf Login (die Seite nicht einfach neu laden).");
        const cfg = await (await fetch("config.json?t=" + Date.now())).json();
        const api = (cfg.api || "").replace(/\/$/, "");
        if (!api) return fail("Der Bot ist offline", "Die Seite kennt die Bot-Adresse noch nicht. Bitte später erneut versuchen.", "no_api");
        let res, data = {};
        try {
          res = await fetch(api + "/api/auth/exchange", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code, site: "apply2" }) });
          data = await res.json().catch(() => ({}));
        } catch (e) {
          return fail("Der Bot hat nicht geantwortet", "Die Adresse ist nicht erreichbar. Der Bot ist vielleicht aus oder wurde neu gestartet.", "network");
        }
        if (!res.ok) return fail("Anmeldung fehlgeschlagen", MESSAGES[data.error] || "Der Bot konnte den Login nicht abschließen.", data.error || ("http_" + res.status));
        localStorage.setItem("dux0a2_token", data.token);
        sessionStorage.removeItem("dux0a2_state");
        location.replace("./");
      } catch (e) {
        fail("Etwas ist schiefgelaufen", String(e));
      }
    })();
  </script>
</body>
</html>
