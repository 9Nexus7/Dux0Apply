<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connecting BIG Games… – DUX0</title>
  <link rel="icon" href="assets/favicon.png">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #06030d; color: #f2ecfc; font: 1rem/1.6 system-ui, sans-serif; text-align: center; padding: 1.5rem; }
    a { color: #dcc9ff; } .box { max-width: 34rem; }
    .spin { width: 34px; height: 34px; margin: 0 auto 1rem; border: 3px solid #31205a; border-top-color: #8b3dff; border-radius: 50%; animation: s 1s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box" id="box"><div class="spin"></div><p>Connecting your BIG Games account…</p></div>
  <script>
    (async () => {
      // Kommt die Verbindung von der Bewerbungsseite (apply2), hat diese ihr Login-Token und die
      // Ruecksprung-Adresse in sessionStorage abgelegt - sonst verhaelt sich die Seite wie bisher.
      const fromApply = sessionStorage.getItem("dux0_big_return");
      const back = fromApply || "./#/connect";
      const box = document.getElementById("box");
      const fail = (t) => { box.innerHTML = ""; const p = document.createElement("p"); p.textContent = t; const a = document.createElement("a"); a.href = back; let en = false; try { en = localStorage.getItem("dux0a2_lang") === "en"; } catch (_) {} a.textContent = fromApply ? (en ? "Back to your application" : "Zurück zur Bewerbung") : "Back to My account"; box.append(p, a); };
      try {
        const q = new URLSearchParams(location.search);
        if (q.get("error")) return fail(fromApply ? "Die Verbindung mit BIG Games wurde abgebrochen." : "BIG Games login was cancelled or denied.");
        const code = q.get("code"), state = q.get("state");
        if (!code || !state) return fail("No login code was received.");
        const token = sessionStorage.getItem("dux0_big_token") || localStorage.getItem("dux0_token");
        if (!token) return fail("You are logged out. Log in with Discord again, then reconnect.");
        const cfg = await (await fetch("config.json?t=" + Date.now())).json();
        const api = (cfg.api || "").replace(/\/$/, "");
        if (!api) return fail("The live server is offline.");
        const res = await fetch(api + "/api/big/exchange", {
          method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
          body: JSON.stringify({ code, state }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) return fail(data.error === "state_mismatch" ? "The connection could not be verified. Please try again." : "BIG Games could not connect your account. Please try again.");
        sessionStorage.removeItem("dux0_big_token");
        sessionStorage.removeItem("dux0_big_return");
        location.replace(back);
      } catch (e) {
        fail("Something went wrong. Please try again.");
      }
    })();
  </script>
</body>
</html>
